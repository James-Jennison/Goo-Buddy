name: Publish verified container image

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: james-jennison/goo-buddy

jobs:
  validate:
    name: Validate release image (${{ matrix.platform }})
    # Runtime validation uses matching native GitHub-hosted architectures.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
            expected_host_arch: x86_64
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
            expected_host_arch: aarch64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Log native runner diagnostics
        run: |
          set -eu
          echo "intended_oci_platform=${{ matrix.platform }}"
          echo "runner_label=${{ matrix.runner }}"
          echo "expected_host_arch=${{ matrix.expected_host_arch }}"
          echo "runner_os=${{ runner.os }}"
          uname -a
          uname -m
          docker version
          docker buildx version
          docker compose version

      - name: Assert native runner architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.expected_host_arch }}
        run: |
          set -eu
          actual="$(uname -m)"
          case "$EXPECTED_HOST_ARCH:$actual" in
            x86_64:x86_64|x86_64:amd64|aarch64:aarch64|aarch64:arm64) ;;
            *)
              echo "expected native $EXPECTED_HOST_ARCH runner, got $actual" >&2
              exit 1
              ;;
          esac

      - name: Verify annotated release tag and source relationship
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{}")"
          MAIN_COMMIT="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$TAG_COMMIT" = "$MAIN_COMMIT"
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI "$TAG_COMMIT")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and load release candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          push: false
          provenance: false
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ steps.release.outputs.commit }}
            CREATED=${{ steps.release.outputs.created }}
          tags: goo-buddy:release-validate-${{ matrix.suffix }}

      - name: Verify architecture and production boundary
        run: |
          set -eu
          test "$(docker image inspect goo-buddy:release-validate-${{ matrix.suffix }} --format '{{.Architecture}}/{{.Os}}')" = "${{ matrix.suffix }}/linux"
          docker run --rm --network none --platform ${{ matrix.platform }} \
            --entrypoint sh goo-buddy:release-validate-${{ matrix.suffix }} -ec '
              . /etc/os-release
              test "$ID" = debian
              python -c "import cv2; print(cv2.__version__)"
            '
          docker run --rm --network none --platform ${{ matrix.platform }} \
            goo-buddy:release-validate-${{ matrix.suffix }} \
            python -c "import backend.app.main"
          docker run --rm --network none --platform ${{ matrix.platform }} \
            --entrypoint sh goo-buddy:release-validate-${{ matrix.suffix }} -ec '
              test ! -e /app/.git
              test ! -d /app/backend/tests
              test ! -d /app/frontend
              test ! -e /app/static/synthetic-printer-preview.mjs
            '

      - name: Record strict Trivy candidate scan as JSON
        # aquasecurity/trivy-action@v0.35.0
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: goo-buddy:release-validate-${{ matrix.suffix }}
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          format: json
          output: trivy-${{ matrix.suffix }}.json
          version: v0.69.2

      - name: Record strict Trivy candidate scan as a table
        # aquasecurity/trivy-action@v0.35.0
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: goo-buddy:release-validate-${{ matrix.suffix }}
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          format: table
          output: trivy-${{ matrix.suffix }}.txt
          version: v0.69.2

      - name: Generate candidate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: goo-buddy:release-validate-${{ matrix.suffix }}
          format: spdx-json
          output-file: goo-buddy-${{ matrix.suffix }}.spdx.json

      - name: Gate fixable container vulnerabilities and report upstream risk
        env:
          IMAGE: goo-buddy:release-validate-${{ matrix.suffix }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          observed_at="$(date --utc +%FT%TZ)"
          review_deadline="$(date --utc -d '+14 days' +%F)"
          python3 scripts/container/validate_vulnerability_gate.py \
            --trivy-json trivy-${{ matrix.suffix }}.json \
            --sbom goo-buddy-${{ matrix.suffix }}.spdx.json \
            --image "$IMAGE" \
            --platform "$PLATFORM" \
            --observed-at "$observed_at" \
            --review-deadline "$review_deadline" \
            --report unresolved-upstream-base-${{ matrix.suffix }}.md

      - name: Upload complete candidate security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-security-${{ matrix.suffix }}
          path: |
            trivy-${{ matrix.suffix }}.json
            trivy-${{ matrix.suffix }}.txt
            goo-buddy-${{ matrix.suffix }}.spdx.json
            unresolved-upstream-base-${{ matrix.suffix }}.md
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish immutable multi-architecture image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify release source and derive immutable tags
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          COMMIT="$(git rev-parse "${RELEASE_TAG}^{}")"
          test "$COMMIT" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          VERSION="${RELEASE_TAG#v}"
          case "$VERSION" in
            *[!0-9A-Za-z.-]*|'') exit 1 ;;
          esac
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$COMMIT" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI "$COMMIT")" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR with the repository workflow token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Refuse existing immutable image tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA_TAG: ${{ steps.release.outputs.sha_tag }}
        run: |
          set -eu
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "immutable version tag already exists: $VERSION" >&2
            exit 1
          fi
          if docker buildx imagetools inspect "$IMAGE:$SHA_TAG" >/dev/null 2>&1; then
            echo "immutable commit tag already exists: $SHA_TAG" >&2
            exit 1
          fi

      - name: Build and publish immutable image index
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ steps.release.outputs.commit }}
            CREATED=${{ steps.release.outputs.created }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.sha_tag }}

      - name: Generate SPDX SBOM for the published image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: goo-buddy.spdx.json

      - name: Pull immutable published platform images for final security evidence
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          manifest_json="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")"
          amd64_digest="$(printf '%s' "$manifest_json" | python3 -c '
          import json
          import sys

          for manifest in json.load(sys.stdin)["manifests"]:
              platform = manifest.get("platform", {})
              if platform.get("os") == "linux" and platform.get("architecture") == "amd64":
                  print(manifest["digest"])
                  break
          else:
              raise SystemExit("linux/amd64 manifest missing from published index")
          ')"
          arm64_digest="$(printf '%s' "$manifest_json" | python3 -c '
          import json
          import sys

          for manifest in json.load(sys.stdin)["manifests"]:
              platform = manifest.get("platform", {})
              if platform.get("os") == "linux" and platform.get("architecture") == "arm64":
                  print(manifest["digest"])
                  break
          else:
              raise SystemExit("linux/arm64 manifest missing from published index")
          ')"
          docker pull "$IMAGE@$amd64_digest"
          amd64_image_id="$(docker image inspect "$IMAGE@$amd64_digest" --format '{{.Id}}')"
          docker tag "$amd64_image_id" goo-buddy:published-amd64
          docker pull "$IMAGE@$arm64_digest"
          arm64_image_id="$(docker image inspect "$IMAGE@$arm64_digest" --format '{{.Id}}')"
          docker tag "$arm64_image_id" goo-buddy:published-arm64

      - name: Record strict final AMD64 Trivy scan as JSON
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: goo-buddy:published-amd64
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          format: json
          output: trivy-published-amd64.json
          version: v0.69.2

      - name: Record strict final AMD64 Trivy scan as a table
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: goo-buddy:published-amd64
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          format: table
          output: trivy-published-amd64.txt
          version: v0.69.2

      - name: Generate final AMD64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: goo-buddy:published-amd64
          format: spdx-json
          output-file: goo-buddy-published-amd64.spdx.json

      - name: Gate final AMD64 fixable vulnerabilities and report upstream risk
        run: |
          set -eu
          python3 scripts/container/validate_vulnerability_gate.py \
            --trivy-json trivy-published-amd64.json \
            --sbom goo-buddy-published-amd64.spdx.json \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            --platform linux/amd64 \
            --observed-at "$(date --utc +%FT%TZ)" \
            --review-deadline "$(date --utc -d '+14 days' +%F)" \
            --report unresolved-upstream-base-published-amd64.md

      - name: Record strict final ARM64 Trivy scan as JSON
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: goo-buddy:published-arm64
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          format: json
          output: trivy-published-arm64.json
          version: v0.69.2

      - name: Record strict final ARM64 Trivy scan as a table
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: goo-buddy:published-arm64
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          format: table
          output: trivy-published-arm64.txt
          version: v0.69.2

      - name: Generate final ARM64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: goo-buddy:published-arm64
          format: spdx-json
          output-file: goo-buddy-published-arm64.spdx.json

      - name: Gate final ARM64 fixable vulnerabilities and report upstream risk
        run: |
          set -eu
          python3 scripts/container/validate_vulnerability_gate.py \
            --trivy-json trivy-published-arm64.json \
            --sbom goo-buddy-published-arm64.spdx.json \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
            --platform linux/arm64 \
            --observed-at "$(date --utc +%FT%TZ)" \
            --review-deadline "$(date --utc -d '+14 days' +%F)" \
            --report unresolved-upstream-base-published-arm64.md

      - name: Upload complete final security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-container-security-evidence
          path: |
            goo-buddy.spdx.json
            trivy-published-amd64.json
            trivy-published-amd64.txt
            goo-buddy-published-amd64.spdx.json
            unresolved-upstream-base-published-amd64.md
            trivy-published-arm64.json
            trivy-published-arm64.txt
            goo-buddy-published-arm64.spdx.json
            unresolved-upstream-base-published-arm64.md
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SPDX SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: goo-buddy.spdx.json
          push-to-registry: true

      - name: Verify remote platforms, labels, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -eu
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > manifest.json
          python3 - <<'PY'
          import json
          manifest = json.load(open("manifest.json", encoding="utf-8"))
          platforms = {
              f'{item.get("platform", {}).get("os")}/{item.get("platform", {}).get("architecture")}'
              for item in manifest.get("manifests", [])
              if item.get("platform", {}).get("os") == "linux"
          }
          required = {"linux/amd64", "linux/arm64"}
          if not required <= platforms:
              raise SystemExit(f"missing runnable platforms: {required - platforms}")
          PY
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$IMAGE@$DIGEST"
            test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "https://github.com/James-Jennison/Goo-Buddy"
            test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$COMMIT"
            test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
            docker image rm "$IMAGE@$DIGEST"
          done

      - name: Set linked GHCR package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "/user/packages/container/goo-buddy" -f visibility=public

      - name: Verify unauthenticated immutable public manifest access
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          token="$(curl --fail --silent --show-error \
            'https://ghcr.io/token?scope=repository:james-jennison/goo-buddy:pull' | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          remote_digest="$(curl --fail --silent --show-error --head \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/James-Jennison/goo-buddy/manifests/$VERSION" | \
            awk 'BEGIN{IGNORECASE=1}/docker-content-digest/{print $2}' | tr -d '\r')"
          test "$remote_digest" = "$DIGEST"
          anonymous_config="$(mktemp -d)"
          DOCKER_CONFIG="$anonymous_config" docker pull "$IMAGE:$VERSION"

      - name: Promote latest only after immutable verification
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          token="$(curl --fail --silent --show-error \
            'https://ghcr.io/token?scope=repository:james-jennison/goo-buddy:pull' | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          latest_digest="$(curl --fail --silent --show-error --head \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            'https://ghcr.io/v2/James-Jennison/goo-buddy/manifests/latest' | \
            awk 'BEGIN{IGNORECASE=1}/docker-content-digest/{print $2}' | tr -d '\r')"
          test "$latest_digest" = "$DIGEST"
